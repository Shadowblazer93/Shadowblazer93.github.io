<!doctype html>
<html lang="en-US">

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Azam Khalid : Portfolio</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">

    <script>
      // Apply the saved theme preference before the page paints to avoid a flash of the wrong theme.
      // The preference is one of: "system" (default), "dark", or "light".
      (function () {
        var preference = 'system';
        try {
          var saved = localStorage.getItem('theme-preference');
          if (saved === 'system' || saved === 'dark' || saved === 'light') {
            preference = saved;
          }
        } catch (e) {}

        var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = preference === 'system' ? (systemDark ? 'dark' : 'light') : preference;
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
